<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Toss</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="stage">

  <header>
    <p class="eyebrow">Est. MCMCC · The Eternal Question</p>
    <h1>Heads or <em>Tails?</em></h1>
  </header>

  <div class="scene">
    <div class="coin idle show-heads" id="coin" style="--face-rot:0deg; --start-rot:0deg;">
      <div class="coin-glow"></div>

      <!-- HEADS -->
      <div class="face heads">
        <div class="face-content">
          <img class="face-img" id="headsImg" alt="Heads" />
        </div>
      </div>

      <!-- TAILS -->
      <div class="face tails">
        <div class="face-content">
          <img class="face-img" id="tailsImg" alt="Tails" />
        </div>
      </div>

    </div><!-- .coin -->
  </div><!-- .scene -->

  <div class="result" id="result">—</div>

  <button class="toss-btn" id="tossBtn">Toss the Coin</button>

  <button class="stats-toggle is-hidden" id="statsToggle" aria-label="Show statistics" aria-pressed="false">
    <!-- open eye (shown when stats are visible) -->
    <svg class="eye eye-open" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z" />
      <circle cx="12" cy="12" r="3" />
    </svg>
    <!-- closed / slashed eye (shown when stats are hidden) -->
    <svg class="eye eye-closed" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 3l18 18" />
      <path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c7 0 10.5 7 10.5 7a18 18 0 0 1-3.2 4.1" />
      <path d="M6.3 6.3A17.9 17.9 0 0 0 1.5 12S5 19 12 19a10.3 10.3 0 0 0 4.3-.9" />
      <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
    </svg>
  </button>

  <div class="stats hidden" id="stats">
    <div class="stat">
      <span class="stat-num" id="headsCount">0</span>
      Heads
    </div>
    <div class="divider"></div>
    <div class="stat">
      <span class="stat-num" id="totalCount">0</span>
      Tosses
    </div>
    <div class="divider"></div>
    <div class="stat">
      <span class="stat-num" id="tailsCount">0</span>
      Tails
    </div>
  </div>

</div><!-- .stage -->

<script src="cointoss.js"></script>
</body>
</html>
